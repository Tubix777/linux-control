name: Verify distribution packages
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: fedora
            image: registry.fedoraproject.org/fedora:44
            script: fedora
          - platform: ubuntu24
            image: ubuntu:24.04
            script: deb
          - platform: ubuntu26
            image: ubuntu:26.04
            script: deb
          - platform: deepin25
            image: linuxdeepin/deepin:25
            script: deb
          - platform: arch
            image: archlinux:latest
            script: arch
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
      - name: Test native pages, build and install package
        run: docker run --rm -v "$PWD:/workspace" -w /workspace '${{ matrix.image }}' bash 'packaging/ci/${{ matrix.script }}.sh'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: uzeyir-control-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

