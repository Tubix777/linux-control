name: Tests and Fedora package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test GTK pages and build Fedora RPM
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace registry.fedoraproject.org/fedora:44 bash -euc '
            dnf -y install python3 python3-gobject python3-cairo python3-pyudev gtk4 libadwaita weston dbus-daemon rpm-build desktop-file-utils tar gzip findutils
            packaging/run_checks.sh
            python3 packaging/build_rpm.py --output dist
          '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-control-fedora
          path: dist/*
          if-no-files-found: error
